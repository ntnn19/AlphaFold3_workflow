$schema: "https://json-schema.org/draft/2020-12/schema"
description: >
  Row-level schema for the data_pipeline_ready sample sheet.
  Each row points to a pre-computed monomer JSON that will be passed directly
  to the AF3 data pipeline (MSA generation), skipping the preprocessing step.
  Required columns: sample_id, file.

type: object
additionalProperties: true

required:
  - sample_id
  - file

properties:

  sample_id:
    type: string
    minLength: 1
    description: "Unique identifier for this monomer sample."

  file:
    type: string
    minLength: 1
    description: "Path to the pre-computed monomer JSON file."

  expected_output:
    type: string
    description: "Expected output path after data pipeline processing (auto-generated by preprocessing)."
