$schema: "https://json-schema.org/draft/2020-12/schema"
description: >
  Row-level schema for the inference_ready sample sheet.
  Each row points to a final merged JSON that will be passed directly to AF3
  inference, skipping both preprocessing and data pipeline steps.
  Required columns: sample_id, file.

type: object
additionalProperties: true

required:
  - sample_id
  - file

properties:

  sample_id:
    type: string
    minLength: 1
    description: "Unique identifier for this inference sample."

  file:
    type: string
    minLength: 1
    description: "Path to the final merged JSON file ready for AF3 inference."

  expected_output:
    type: string
    description: "Expected output path after inference (auto-generated by preprocessing)."
