sample_sheets:
  raw_data: pulldown_template_free.tsv
mode: pulldown
msa_option: none
#n_splits: 1 # Optional, for running using the 'parallel' branch of this repo. To maximize resources utilization, the value of this flag should correspond to min(number_of_predictions, number_of_multi-GPU_nodes). 
af3_flags:
  af3_container: "/data/singularity/alphafold3/alphafold3_v3.0.2_f6a5aec.sif"
  models_dir: "/data/singularity/alphafold3/weights"       # AlphaFold 3 model weights
  databases_dir: "/var/lib/databases/af3db" # Genetic databases (~2 TB)
  tmp_dir: "tmp"                     # Scratch space for AF3 temp files
  # ---------------------------------------------------------------------------
  # Extra AlphaFold 3 flags (passed verbatim to run_alphafold.py)
  # ---------------------------------------------------------------------------
  extra_af3_flags: "--force_output_dir=true \
    --small_bfd_database_path='/var/lib/databases/af3db/bfd-first_non_consensus_sequences.fasta.shuffled.split/bfd-first_non_consensus_sequences.fasta@64' \
    --small_bfd_z_value=65984053 \
    --mgnify_database_path='/var/lib/databases/af3db/mgy_clusters_2022_05.fa.shuffled.split/mgy_clusters_2022_05.fa@512' \
    --mgnify_z_value=623796864 \
    --uniprot_cluster_annot_database_path='/var/lib/databases/af3db/uniprot_all_2021_04.fa.shuffled.split/uniprot_all_2021_04.fa@256' \
    --uniprot_cluster_annot_z_value=225619586 \
    --uniref90_database_path='/var/lib/databases/af3db/uniref90_2022_05.fa.shuffled.split/uniref90_2022_05.fa@128' \
    --uniref90_z_value=153742194 \
    --ntrna_database_path='/var/lib/databases/af3db/nt_rna_2023_02_23_clust_seq_id_90_cov_80_rep_seq.fasta.shuffled.split/nt_rna_2023_02_23_clust_seq_id_90_cov_80_rep_seq.fasta@256' \
    --ntrna_z_value=76752 \
    --rfam_database_path='/var/lib/databases/af3db/rfam_14_9_clust_seq_id_90_cov_80_rep_seq.fasta.shuffled.split/rfam_14_9_clust_seq_id_90_cov_80_rep_seq.fasta@16' \
    --rfam_z_value=138 \
    --rna_central_database_path='/var/lib/databases/af3db/rnacentral_active_seq_id_90_cov_80_linclust.fasta.shuffled.split/rnacentral_active_seq_id_90_cov_80_linclust.fasta@64' \
    --rna_central_z_value=13271 \
    --jackhmmer_n_cpu=2 \
    --jackhmmer_max_parallel_shards=16 \
    --nhmmer_n_cpu=2 \
    --nhmmer_max_parallel_shards=16"
run_data_pipeline_locally: true
exclusive_lock: false
