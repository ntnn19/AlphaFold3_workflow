sample_sheets:
  data_pipeline_ready: data_pipeline_ready_samples.tsv
mode: custom
msa_option: none
n_splits: 1 # Optional, for running using the 'parallel' branch of this repo. To maximize resources utilization, the value of this flag should correspond to min(number_of_predictions, number_of_multi-GPU_nodes).
af3_flags:
  af3_data_pipeline_container: "/data/singularity/alphafold3/alphafold3_v3.0.3_cbdd420.sif"
  #af3_inference_container: "/data/singularity/alphafold3/alphafold3_v3.0.3_cbdd420.sif"
  af3_inference_container: "/data/singularity/alphafold3/alphafold3_latest_parallel_a100_40gb.sif"
  models_dir: "/data/singularity/alphafold3/weights"       # AlphaFold 3 model weights
  databases_dir: "/var/lib/databases/af3db" # Genetic databases (~2 TB)
  tmp_dir: "tmp"                     # Scratch space for AF3 temp files

output_dir: test_custom_v3.0.1
run_data_pipeline_locally: true
exclusive_lock: true
n_seeds: 1
af3_inference_version: v3.0.1

