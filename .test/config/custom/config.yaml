sample_sheets:
  raw_data: custom.tsv
mode: custom
msa_option: none
n_splits: 1 # Optional, for running using the 'parallel' branch of this repo. To maximize resources utilization, the value of this flag should correspond to min(number_of_predictions, number_of_multi-GPU_nodes).
af3_flags:
  #af3_container: "/data/singularity/alphafold3/alphafold3_latest_parallel_a100_40gb.sif"
  af3_container: "/scratch1/common/singularity_containers/alphafold3/alphafold3_v3.0.2_f6a5aec.sif" #"/data/singularity/alphafold3/alphafold3_v3.0.3_cbdd420.sif"
  models_dir: "/scratch1/common/singularity_containers/alphafold3/weights" #"/data/singularity/alphafold3/weights"       # AlphaFold 3 model weights
  databases_dir: "/scratch1/common/databases/af3_db" #"/var/lib/databases/af3db" # Genetic databases (~2 TB)
  tmp_dir: "tmp" # Scratch space for AF3 temp files
  # ---------------------------------------------------------------------------
  # Extra AlphaFold 3 flags (passed verbatim to run_alphafold.py)
  # ---------------------------------------------------------------------------
  #extra_af3_data_flags: "--server_mode --server_url http://131.169.143.240:8000 --force_output_dir"
  extra_af3_inference_flags: "--force_output_dir"

output_dir: test_custom
run_data_pipeline_locally: true
exclusive_lock: true
n_seeds: 1
af3_version: v3.0.2
